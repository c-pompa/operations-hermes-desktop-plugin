# CI for the operations plugin: the unit tests and Hermes's catalog admission checks, plus
# repository conformance (secrets scan, pinned catalog assets). Shell jobs run on the mini
# runner, which has ~/.hermes/hermes-agent; Docker jobs use public images pinned by version
# and digest. Every job is read-only: nothing here touches a host.

workflow:
  rules:
    # MR pipelines, plus branch pipelines only when no MR is open (no duplicates).
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - conformance

default:
  interruptible: true

# tests/ per AGENTS.md: the suite runs against the hermes-agent venv (plugin_api imports
# hermes_cli, fastapi, agent.secret_scope) and writes only to temp dirs.
unit-tests:
  stage: test
  tags: [mini]
  script:
    - ~/.hermes/hermes-agent/.venv/bin/python3 -m unittest discover -s tests

# The catalog admission checks (rules 6-9): security scan, desktop surface, no core override,
# declared capabilities matching what the plugin registers.
plugin-validate:
  stage: test
  tags: [mini]
  script:
    - ~/.hermes/hermes-agent/.venv/bin/hermes plugins validate plugins/operations

# The catalog entry in docs/catalog stays valid against hermes-agent's schema.
catalog-entry:
  stage: conformance
  tags: [mini]
  script:
    - ~/.hermes/hermes-agent/.venv/bin/python3 ~/.hermes/hermes-agent/scripts/validate_plugin_catalog.py docs/catalog/operations.yaml

# The entry's card image and screenshots stay pinned to its sha and fetchable; the docs site
# renders them at that sha.
catalog-assets:
  stage: conformance
  image:
    name: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
  script:
    - pip install --quiet --disable-pip-version-check pyyaml==6.0.2
    - python3 ci/catalog_assets.py

# Scans full history, not just the diff, so a secret added and then deleted in the same MR
# still fails. Findings are redacted in the log and report.
secrets:
  stage: conformance
  image:
    name: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - gitleaks git --redact --no-banner -v --report-format json --report-path gitleaks.json .
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - gitleaks.json
